# Modelo maven-basic: projeto Maven minimo com uma classe cientifica e um teste JUnit 5.
#
# Cada linha "file.<destino>=<origem>" gera um arquivo. Destino e origem aceitam as
# variaveis do gerador (ver README do gerador). Os modelos nao usam ${...} do Maven:
# qualquer ${...} e tratado como variavel do gerador e precisa ter valor.
name=maven-basic
version=1.0.0

file..github/workflows/build.yml=build.yml.tpl
file..gitignore=gitignore.tpl
file.LICENSE=licenses/${licenseSpdx}.txt
file.README.md=README.md.tpl
file.docs/index.md=docs-index.md.tpl
file.pom.xml=pom.xml.tpl
file.src/main/java/${packagePath}/${firstClassName}.java=FirstClass.java.tpl
file.src/main/resources/.gitkeep=gitkeep.tpl
file.src/test/java/${packagePath}/${firstClassName}Test.java=FirstClassTest.java.tpl
